name: spoton
description: "Um aplicativo que mostra eventos na sua regiao"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  http: ^1.2.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  geocoding: ^5.0.0
  provider: ^6.1.5+1
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  url_launcher: ^6.3.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^17.0.1
  path_provider: ^2.1.6
  table_calendar: ^3.3.0
  firebase_app_check: ^0.5.0
  shared_preferences: ^2.5.6
  firebase_analytics: ^13.0.0
  cached_network_image: ^4.0.4
  firebase_crashlytics: ^6.0.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/